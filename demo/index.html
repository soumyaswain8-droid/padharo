<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Padharo — society in your pocket</title>
<!--
  Padharo — पधारो ("please, come in")  ·  Living demo (Aurora Glass)
  A 20-flat society (Green Meadows) on a regular morning. One in-memory `state` is the
  source of truth; all 3 personas read/write it. A scripted "living" engine fires events
  over time (toasts + notifications + badges) to feel like a real app mid-day.
  Dynamic content is escaped via esc() before rendering.
-->
<style>
  :root{
    --ink:#f4f1ff; --muted:rgba(238,234,255,.62); --faint:rgba(238,234,255,.42);
    --accent:#ff8a4c; --accent-d:#ff7a36; --accent-2:#46e0d0;
    --accent-soft:rgba(255,138,76,.16); --cyan-soft:rgba(70,224,208,.16);
    --ok:#34e0a1; --ok-soft:rgba(52,224,161,.15);
    --warn:#ffc24b; --warn-soft:rgba(255,194,75,.15);
    --bad:#ff6b6b; --bad-soft:rgba(255,107,107,.15);
    --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.09);
    --brd:rgba(255,255,255,.14); --brd-soft:rgba(255,255,255,.09);
    --radius:18px;
    --glow-a:0 8px 30px rgba(0,0,0,.38); --ring:inset 0 1px 0 rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 14px;
       color:var(--ink);background:#07060f;
       background-image:radial-gradient(900px 600px at 15% -5%,rgba(255,138,76,.20),transparent 60%),
         radial-gradient(800px 700px at 110% 10%,rgba(120,80,255,.22),transparent 60%),
         radial-gradient(700px 700px at 50% 120%,rgba(70,224,208,.14),transparent 60%),
         linear-gradient(160deg,#0a0816,#0e0a1f 60%,#120c26)}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:15px;color:rgba(255,255,255,.9)}
  .brand .logo{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
       filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .brand .logo svg{width:100%;height:100%;display:block}
  .brand b{font-size:18px;letter-spacing:.2px} .brand span{font-size:12.5px;color:var(--muted)}

  .phone{width:392px;max-width:96vw;height:812px;max-height:88vh;position:relative;
       border-radius:42px;overflow:hidden;display:flex;flex-direction:column;
       background:linear-gradient(165deg,#15102e,#1b1440 55%,#221651);
       box-shadow:0 40px 90px rgba(80,40,160,.45),0 0 0 10px #07060f,0 0 0 12px rgba(255,255,255,.08),0 0 60px rgba(120,80,255,.25)}
  .notch{height:24px;background:rgba(0,0,0,.35);flex:none;position:relative;z-index:4}
  .aurora{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .aurora span{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;mix-blend-mode:screen;
       animation:auroraDrift 20s ease-in-out infinite}
  .aurora span:nth-child(1){width:300px;height:300px;background:#ff8a4c;top:-60px;left:-50px}
  .aurora span:nth-child(2){width:280px;height:280px;background:#7a4bff;bottom:60px;right:-70px;animation-delay:-6s}
  .aurora span:nth-child(3){width:240px;height:240px;background:#46e0d0;top:42%;left:30%;animation-delay:-12s;opacity:.4}
  @keyframes auroraDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,34px) scale(1.15)}}

  /* status bar (persistent) */
  .statusbar{display:flex;align-items:center;gap:10px;padding:8px 14px;flex:none;position:relative;z-index:4;
       background:rgba(12,9,28,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
       border-bottom:1px solid var(--brd-soft);font-size:12px}
  .statusbar .live{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:800;letter-spacing:.05em}
  .statusbar .live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);
       animation:pulse 1.6s ease-in-out infinite}
  .statusbar .live.off{color:var(--faint)} .statusbar .live.off .dot{background:var(--faint);box-shadow:none;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .statusbar .clock{color:rgba(255,255,255,.86);font-weight:700;font-variant-numeric:tabular-nums}
  .statusbar .sp{flex:1}
  .iconbtn{position:relative;width:32px;height:32px;border-radius:10px;border:1px solid var(--brd-soft);
       background:var(--glass);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .iconbtn:active{transform:scale(.94)}
  .badge{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
       background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
       box-shadow:0 0 10px rgba(255,107,107,.7)}
  .badge:empty,.badge.hide{display:none}

  .switcher{display:flex;gap:6px;padding:9px 10px;flex:none;align-items:center;position:relative;z-index:4;
       background:rgba(12,9,28,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
       border-bottom:1px solid var(--brd-soft)}
  .switcher button{flex:1;border:1px solid var(--brd-soft);background:var(--glass);color:rgba(255,255,255,.72);
       padding:9px 4px;border-radius:13px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;
       display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1}
  .switcher button .ic{font-size:16px}
  .switcher button.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),#ff6a8c);
       box-shadow:0 6px 18px rgba(255,138,76,.5),var(--ring)}
  .switcher .help{flex:none;width:36px;align-self:stretch;color:var(--accent-2);font-size:15px;border-radius:13px;
       background:var(--cyan-soft);border:1px solid rgba(70,224,208,.3)}

  /* toasts (persistent overlay) */
  .toasts{position:absolute;top:96px;left:0;right:0;z-index:45;display:flex;flex-direction:column;align-items:center;
       gap:8px;pointer-events:none;padding:0 14px}
  .toast{width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
       background:linear-gradient(135deg,rgba(40,30,74,.92),rgba(28,20,58,.95));border:1px solid var(--brd);
       box-shadow:0 14px 36px rgba(0,0,0,.5),var(--ring);animation:toastIn .3s cubic-bezier(.2,.8,.25,1);backdrop-filter:blur(12px)}
  .toast.out{animation:toastOut .3s ease forwards}
  .toast .ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
       font-size:17px;background:var(--accent-soft);border:1px solid var(--brd-soft)}
  .toast.alert{border-color:rgba(255,107,107,.5);box-shadow:0 14px 36px rgba(255,60,60,.35)}
  .toast.alert .ic{background:var(--bad-soft)}
  .toast .t{font-size:13px;font-weight:700;line-height:1.25}.toast .d{font-size:11px;color:var(--muted)}
  @keyframes toastIn{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes toastOut{to{transform:translateY(-10px);opacity:0}}

  .screen{flex:1;overflow-y:auto;padding:6px 0 26px;position:relative;z-index:2}
  .screen::-webkit-scrollbar{width:0}

  .card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
       border:1px solid var(--brd);border-radius:var(--radius);padding:15px;margin:11px 12px;box-shadow:var(--glow-a),var(--ring)}
  .card.tight{padding:13px 15px}
  .hdr{border-radius:var(--radius);margin:11px 12px;padding:16px;color:#fff;position:relative;overflow:hidden;
       background:linear-gradient(135deg,rgba(255,138,76,.92),rgba(168,90,255,.82));border:1px solid rgba(255,255,255,.18);
       box-shadow:0 12px 34px rgba(168,90,255,.4),var(--ring)}
  .hdr h2{margin:0 0 3px;font-size:18px}.hdr .sub{font-size:12.5px;opacity:.95}
  .hdr .flat{display:inline-block;margin-top:9px;background:rgba(255,255,255,.22);padding:3px 12px;border-radius:20px;
       font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.25)}
  .sec-t{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);
       margin:18px 22px 4px;display:flex;justify-content:space-between;align-items:center}
  .sec-t a{color:var(--accent-2);text-decoration:none;font-size:11.5px;font-weight:700;cursor:pointer}

  .row{display:flex;align-items:center;gap:11px}
  .avatar{width:43px;height:43px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
       color:#fff;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
  .grow{flex:1;min-width:0}
  .nm{font-weight:700;font-size:14px;color:#fff}.meta{font-size:12px;color:var(--muted);margin-top:1px}
  .muted{color:var(--muted)}

  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid transparent}
  .pill.ok{background:var(--ok-soft);color:var(--ok);border-color:rgba(52,224,161,.35)}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(255,194,75,.35)}
  .pill.bad{background:var(--bad-soft);color:var(--bad);border-color:rgba(255,107,107,.35)}
  .pill.grey{background:var(--glass-2);color:rgba(255,255,255,.66);border-color:var(--brd-soft)}

  .btns{display:flex;gap:9px;margin-top:13px}
  button.act{flex:1;border:1px solid transparent;border-radius:13px;padding:12px;font-size:13.5px;font-weight:700;
       cursor:pointer;transition:.18s;color:#fff}
  button.act:active{transform:scale(.97)}
  .approve{background:linear-gradient(135deg,#2fd996,#19b87c);box-shadow:0 6px 18px rgba(52,224,161,.4)}
  .deny{background:var(--bad-soft);color:#ff9a9a;border-color:rgba(255,107,107,.3)}
  .ghost{background:var(--glass-2);color:rgba(255,255,255,.8);border-color:var(--brd-soft)}
  .primary{background:linear-gradient(135deg,var(--accent),#ff6a8c);box-shadow:0 6px 18px rgba(255,138,76,.45)}
  .primary:hover{filter:brightness(1.06)}

  /* quick actions */
  .qa{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:11px 12px}
  .qa-btn{border:1px solid var(--brd-soft);background:var(--glass);border-radius:15px;padding:12px 4px;cursor:pointer;
       display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;transition:.18s}
  .qa-btn:active{transform:scale(.95)}.qa-btn:hover{background:var(--glass-2)}
  .qa-btn .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;
       background:linear-gradient(135deg,rgba(255,138,76,.85),rgba(168,90,255,.65));box-shadow:0 5px 14px rgba(168,90,255,.4)}
  .qa-btn .l{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.85)}
  .qa-btn.sos .ic{background:linear-gradient(135deg,#ff5c5c,#d12f4f);box-shadow:0 5px 16px rgba(255,60,60,.55)}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:16px 10px}
  .empty .big{font-size:28px;display:block;margin-bottom:6px}

  .bigbtn{display:flex;align-items:center;gap:13px;width:100%;cursor:pointer;text-align:left;border:1px solid var(--brd);
       border-radius:var(--radius);padding:16px;margin:11px 12px;background:var(--glass);backdrop-filter:blur(18px);
       box-shadow:var(--glow-a),var(--ring);transition:.18s}
  .bigbtn:hover{background:var(--glass-2);transform:translateY(-1px)}
  .bigbtn .ic{width:46px;height:46px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;
       font-size:21px;flex:none;background:linear-gradient(135deg,rgba(255,138,76,.9),rgba(168,90,255,.7));box-shadow:0 6px 16px rgba(168,90,255,.4)}
  .bigbtn .t{font-weight:800;font-size:15px;color:#fff}.bigbtn .s{font-size:12px;color:var(--muted)}
  .bigbtn .chev{color:var(--faint);font-size:22px}

  .billamt{font-size:30px;font-weight:800;letter-spacing:-.5px;color:#fff;text-shadow:0 0 22px rgba(255,138,76,.4)}
  .barwrap{height:10px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;margin:10px 0 4px}
  .bar{height:100%;border-radius:10px;transition:.5s;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 16px rgba(70,224,208,.5)}
  .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.stat b{color:#fff}
  .divline{height:1px;background:var(--brd-soft);margin:12px 0}

  #modal:empty{display:none}
  .overlay{position:absolute;inset:0;background:rgba(6,4,16,.62);backdrop-filter:blur(4px);display:flex;flex-direction:column;
       justify-content:flex-end;z-index:50;animation:fade .18s ease}
  .sheet{border-radius:24px 24px 0 0;padding:22px 18px 26px;animation:rise .28s cubic-bezier(.2,.8,.25,1);
       background:linear-gradient(165deg,rgba(34,26,68,.95),rgba(22,16,46,.97));backdrop-filter:blur(26px);
       border-top:1px solid var(--brd);box-shadow:0 -20px 60px rgba(0,0,0,.5);max-height:86%;overflow-y:auto}
  .sheet h3{margin:0 0 14px;font-size:18px;color:#fff}
  .sheet label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:12px 0 5px;letter-spacing:.03em}
  .sheet input,.sheet select,.sheet textarea{width:100%;border:1px solid var(--brd);border-radius:13px;padding:12px;
       font-size:15px;background:rgba(255,255,255,.06);color:#fff;outline:none;transition:.18s}
  .sheet input::placeholder,.sheet textarea::placeholder{color:var(--faint)}
  .sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(70,224,208,.18)}
  .sheet select{appearance:none}.sheet select option{color:#1a1530}.sheet textarea{min-height:64px;resize:none}
  .sheet .primary,.sheet .ghost{width:100%;border:0;border-radius:14px;padding:14px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:16px;color:#fff}
  .bigcode{font-size:42px;font-weight:800;letter-spacing:12px;color:#fff;text-align:center;
       background:linear-gradient(135deg,var(--accent-soft),var(--cyan-soft));border:1px solid var(--brd);
       border-radius:16px;padding:20px;margin:14px 0 4px;text-shadow:0 0 26px rgba(255,138,76,.6)}
  .tick{width:64px;height:64px;border-radius:50%;color:#fff;font-size:33px;font-weight:800;display:flex;align-items:center;
       justify-content:center;margin:6px auto 14px;background:linear-gradient(135deg,#2fd996,#19b87c);box-shadow:0 0 30px rgba(52,224,161,.55)}
  .tick.red{background:linear-gradient(135deg,#ff5c5c,#d12f4f);box-shadow:0 0 30px rgba(255,60,60,.6)}
  .scriptlist{margin:0;padding-left:20px;font-size:14px;line-height:1.75;color:rgba(255,255,255,.9)}
  .scriptlist li{margin-bottom:5px}.scriptlist b{color:var(--accent-2)}
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .foot{text-align:center;font-size:11px;color:var(--faint);margin-top:15px}
</style>
</head>
<body>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="aFill" gradientUnits="userSpaceOnUse" x1="24" y1="10" x2="24" y2="36">
          <stop offset="0" stop-color="#e0d9cd"/><stop offset="0.37" stop-color="#ada291"/>
          <stop offset="0.37" stop-color="#d4632f"/><stop offset="1" stop-color="#9a3716"/>
        </linearGradient>
        <clipPath id="aClip"><text x="24" y="36" text-anchor="middle" font-family="'Inter',sans-serif" font-size="40" font-weight="800">प</text></clipPath>
      </defs>
      <g font-family="'Inter',sans-serif" font-size="40" font-weight="800" text-anchor="middle">
        <text x="24" y="36" fill="#431909" transform="translate(5.4,6)">प</text>
        <text x="24" y="36" fill="#481b0a" transform="translate(4.5,5)">प</text>
        <text x="24" y="36" fill="#4d1d0b" transform="translate(3.6,4)">प</text>
        <text x="24" y="36" fill="#53200c" transform="translate(2.7,3)">प</text>
        <text x="24" y="36" fill="#59230e" transform="translate(1.8,2)">प</text>
        <text x="24" y="36" fill="#5f250f" transform="translate(0.9,1)">प</text>
        <text x="24" y="36" fill="url(#aFill)">प</text>
      </g>
      <g clip-path="url(#aClip)" stroke="#7a2c10" stroke-width="1.2" opacity=".4" stroke-linecap="round">
        <path d="M0 27 H48"/><path d="M0 32 H48"/><path d="M19 22 V27"/><path d="M30 27 V32"/><path d="M19 32 V40"/>
      </g>
      <path d="M0 19.6 H48" clip-path="url(#aClip)" stroke="#948a7b" stroke-width="1.1" opacity=".65"/>
    </svg></div>
    <div><b>Padharo</b> &nbsp;<span>society in your pocket</span></div>
  </div>

  <div class="phone">
    <div class="aurora"><span></span><span></span><span></span></div>
    <div class="notch"></div>
    <div class="statusbar">
      <span class="live" id="liveTag"><span class="dot"></span>LIVE</span>
      <span class="clock" id="clock">09:14</span>
      <span class="sp"></span>
      <button class="iconbtn" onclick="showNotifs()">🔔<span class="badge" id="badge"></span></button>
      <button class="iconbtn" id="engineBtn" onclick="toggleEngine()" title="Pause live events">⏸</button>
    </div>
    <div class="switcher">
      <button data-p="resident"  onclick="setPersona('resident')"><span class="ic">🏠</span>Resident</button>
      <button data-p="guard"     onclick="setPersona('guard')"><span class="ic">🛡️</span>Guard</button>
      <button data-p="committee" onclick="setPersona('committee')"><span class="ic">📋</span>Committee</button>
      <button class="help" onclick="showScript()" title="How to demo">?</button>
    </div>
    <div class="toasts" id="toasts"></div>
    <div id="screen" class="screen"></div>
    <div id="modal"></div>
  </div>
  <div class="foot">Living demo • Green Meadows, 20 flats • mock data, no real accounts</div>

<script>
/* ====================== SEED (fresh copy each replay) ====================== */
const FLATS = [
  ['A-101','Rao Family'],['A-102','Mehta Family'],['A-201','Sharma Family'],['A-202','Pillai Family'],
  ['A-301','Banerjee Family'],['A-302','Soumya Swain'],['A-401','Nair Family'],['A-402','Gupta Family'],
  ['A-501','Fernandes Family'],['A-502','Khan Family'],
  ['B-101','Reddy Family'],['B-102','Joshi Family'],['B-201','Desai Family'],['B-202','Iyer Family'],
  ['B-301','Verma Family'],['B-302','Kulkarni Family'],['B-401','Chawla Family'],['B-402','Ghosh Family'],
  ['B-501','Menon Family'],['B-502','Sinha Family'],
];
const DUE = ['A-302','A-202','A-401','B-102','B-301','B-402','B-501'];   // 7 due, 13 paid (~65%)
const TONES = ['#6c8cd5','#cf6f9b','#5aa6a0','#d59a5a','#8c7bd6','#d6695a','#5a9bd6'];

function freshState(){
  return {
    persona:'resident', me:'A-302', seq:1000,
    society:{ name:'Green Meadows', flats:20, month:'May 2026' }, guardName:'Lakshman',
    residents: FLATS.map(([flat,name])=>({flat,name})),
    bills: FLATS.map(([flat])=>({flat, amount:2400, status: DUE.includes(flat)?'due':'paid'})),
    visitors:[
      {id:1,name:'Ramesh (Plumber)',flat:'A-302',purpose:'Service',status:'pending', time:'10:42 AM',tone:'#6c8cd5'},
      {id:2,name:'Anjali (Guest)',  flat:'A-201',purpose:'Guest',  status:'approved',time:'09:15 AM',tone:'#cf6f9b'},
      {id:3,name:'Zomato',          flat:'A-102',purpose:'Food delivery',status:'approved',time:'09:40 AM',tone:'#d6695a'},
      {id:4,name:'Iqbal (Electrician)',flat:'B-202',purpose:'Service',status:'pending',time:'10:05 AM',tone:'#5aa6a0'},
      {id:5,name:'Priya (Guest)',   flat:'B-401',purpose:'Guest',  status:'approved',time:'08:50 AM',tone:'#8c7bd6'},
      {id:6,name:'DTDC Courier',    flat:'A-501',purpose:'Parcel', status:'denied',  time:'09:05 AM',tone:'#d59a5a'},
    ],
    deliveries:[
      {id:7,type:'delivery',vendor:'Amazon', flat:'A-302',code:'4821',status:'expected'},
      {id:8,type:'delivery',vendor:'Flipkart',flat:'B-102',code:'7240',status:'expected'},
      {id:9,type:'delivery',vendor:'Swiggy', flat:'A-202',code:'3155',status:'expected'},
      {id:10,type:'cab',    vendor:'Uber',   flat:'B-301',code:'9080',status:'expected'},
    ],
    staff:[
      {id:11,name:'Lakshmi',role:'Maid',    flats:'A-302, A-201, B-101',status:'in', time:'08:10 AM'},
      {id:12,name:'Suresh', role:'Cook',    flats:'A-302, B-202',       status:'in', time:'07:55 AM'},
      {id:13,name:'Geeta',  role:'Maid',    flats:'B-301, B-402',       status:'in', time:'08:25 AM'},
      {id:14,name:'Mohan',  role:'Gardener',flats:'Common areas',       status:'in', time:'07:30 AM'},
      {id:15,name:'Ravi',   role:'Driver',  flats:'A-401',              status:'out',time:'—'},

/* ====================== clock (simulated morning) ====================== */
let simMin = 9*60+14, clockTimer=null;

function nowLabel(){ const h12=((Math.floor(simMin/60)+11)%12)+1, m=simMin%60, ap=Math.floor(simMin/60)%24<12?'AM':'PM';

/* ====================== toasts + notifications ====================== */
function showToast(icon,text,sub,alert){
  const wrap=document.getElementById('toasts');
  const el=document.createElement('div'); el.className='toast'+(alert?' alert':'');
  const ic=document.createElement('div'); ic.className='ic'; ic.textContent=icon;
  const tx=document.createElement('div'); tx.className='grow';
  const t=document.createElement('div'); t.className='t'; t.textContent=text;
  tx.appendChild(t);
  if(sub){const d=document.createElement('div');d.className='d';d.textContent=sub;tx.appendChild(d);}
  el.appendChild(ic); el.appendChild(tx); wrap.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},4200);
}
function notify(icon,text){ state.notifications.unshift({id:nextId(),icon,text,time:nowLabel(),read:false}); updateBadge(); }
function updateBadge(){ const n=state.notifications.filter(x=>!x.read).length;
  const b=document.getElementById('badge'); b.textContent=n?String(n):''; b.classList.toggle('hide',!n); }
function showNotifs(){
  state.notifications.forEach(x=>x.read=true); updateBadge();
  const list = state.notifications.length
    ? state.notifications.map(n=>`<div class="row" style="margin-top:11px">
        <div class="avatar" style="background:var(--glass-2);font-size:18px">${n.icon}</div>
        <div class="grow"><div class="nm">${esc(n.text)}</div><div class="meta">${n.time}</div></div></div>`).join('<div class="divline"></div>')
    : '<div class="empty"><span class="big">🔔</span>No notifications yet.</div>';
  openModal(`<h3>Notifications</h3>${list}<button class="ghost" onclick="closeModal()">Close</button>`);
}

  if(decision==='approved') showToast('✅',v.name+' approved','Gate notified for '+v.flat);

}

    <div class="qa-btn" onclick="showPostNotice()"><div class="ic">📢</div><div class="l">Post notice</div></div>
    <div class="qa-btn" onclick="callGuard()"><div class="ic">📞</div><div class="l">Call gate</div></div>
    <div class="qa-btn" onclick="showNotifs()"><div class="ic">📡</div><div class="l">Activity</div></div>
    <div class="qa-btn" onclick="showStaff()"><div class="ic">🧹</div><div class="l">Staff</div></div>
  </div>`;

  h+=`<div class="sec-t">Maintenance collection</div><div class="card">
      <div class="row" style="justify-content:space-between"><div class="nm" style="font-size:16px">${paid} of ${total} flats paid</div>
        <div class="nm" style="font-size:16px;color:var(--accent-2)">${pct}%</div></div>
      <div class="barwrap"><div class="bar" style="width:${pct}%"></div></div>
      <div class="stat"><span>Collected <b>${fmt(got)}</b></span><span>Expected <b>${fmt(exp)}</b></span></div>
      <div class="divline"></div>
      <div class="meta" style="margin-bottom:2px">Pending (${due.length}):</div>
      ${due.map(b=>`<div class="row" style="margin-top:7px"><div class="grow"><div class="nm">${b.flat} <span class="meta">· ${esc(nameOf(b.flat))}</span></div></div>
        <span class="pill warn">${fmt(b.amount)} due</span></div>`).join('')||'<div class="meta">All clear 🎉</div>'}
    </div>`;

  if(state.alerts.length){
    h+=`<div class="sec-t">🚨 SOS alerts</div>`+state.alerts.map(a=>`<div class="card tight" style="border-color:rgba(255,107,107,.4)">
      <div class="row"><div class="avatar" style="background:linear-gradient(135deg,#ff5c5c,#d12f4f)">🚨</div>
      <div class="grow"><div class="nm">${a.by} · ${esc(nameOf(a.by))}</div><div class="meta">${a.time}</div></div>
      <button class="act approve" style="flex:none;padding:9px 13px;font-size:12px" onclick="clearAlert(${a.id})">Handled</button></div></div>`).join('');
  }

  h+=`<div class="sec-t">Open complaints (${open.length})</div><div class="card tight">`;
  h+= open.length?open.map(c=>`<div class="row" style="margin-top:9px"><div class="grow">
        <div class="nm">${esc(c.title)}</div><div class="meta">${c.flat} • ${c.date}</div></div>
        <button class="act approve" style="flex:none;padding:9px 13px;font-size:12px" onclick="resolveComplaint(${c.id})">Resolve</button></div>`).join('')
      :'<div class="empty" style="padding:10px"><span class="big">✅</span>No open complaints.</div>';
  h+=`</div>`;

  h+=`<div class="sec-t">Amenity bookings</div><div class="card tight">`+
     state.bookings.map(x=>`<div class="row" style="margin-top:9px"><div class="avatar" style="background:var(--cyan-soft);color:#fff">🎟️</div>
        <div class="grow"><div class="nm">${esc(x.amenity)} — ${x.flat}</div><div class="meta">${esc(x.when)}${x.note?' • '+esc(x.note):''}</div></div></div>`).join('')+`</div>`;

  h+=`<div class="sec-t">Notices <a onclick="showPostNotice()">＋ Post notice</a></div><div class="card tight">`+
     state.notices.map(n=>`<div style="margin-top:10px"><div class="row" style="justify-content:space-between">
        <div class="nm">${esc(n.title)}</div><div class="meta">${n.date}</div></div>
        ${n.body?'<div class="meta" style="margin-top:2px">'+esc(n.body)+'</div>':''}</div>`).join('<div class="divline"></div>')+`</div>`;
  paint(h);
}

/* ====================== demo script ====================== */
function showScript(){
  openModal(`<h3>90-second pitch</h3><ol class="scriptlist">
    <li>Watch the <b>LIVE</b> feed — events arrive on their own (toasts + 🔔 badge).</li>
    <li>As <b>Guard</b>, tap "New visitor" for A-302.</li>
    <li>Switch to <b>Resident</b> → approve it. <i>(live-linked)</i></li>
    <li>Pay the <b>bill</b>; as <b>Committee</b> watch collection rise.</li>
    <li>Hit <b>SOS</b> as a resident → see it on the Guard &amp; Committee screens.</li>
    <li>Post a notice; mark a complaint resolved. Tap ⏸ to pause the live feed.</li>
  </ol><button class="primary" onclick="closeModal()">Got it</button>`);
}

/* ====================== living engine ====================== */
const DAY=[
  ()=>{const v={id:nextId(),name:'Swiggy',flat:'B-202',purpose:'Food delivery',status:'pending',time:nowLabel(),tone:'#d6695a'};
       state.visitors.push(v); notify('🛵','Swiggy at the gate for B-202'); showToast('🛵','Swiggy at the gate','For B-202 (Iyer Family)'); render();},
  ()=>{const b=state.bills.find(x=>x.flat==='B-102'); if(b)b.status='paid'; notify('💳','B-102 (Joshi Family) paid maintenance');
       showToast('💳','Maintenance paid','B-102 • '+fmt(2400)); render();},
  ()=>{const s=state.staff.find(x=>x.id===15); if(s){s.status='in';s.time=nowLabel();} notify('🧹','Ravi (Driver) checked in');
       showToast('🧹','Ravi checked in','Driver • A-401'); render();},
  ()=>{const v={id:nextId(),name:'Relative (Guest)',flat:'A-201',purpose:'Guest',status:'pending',time:nowLabel(),tone:'#8c7bd6'};
       state.visitors.push(v); notify('🚪','New guest for A-201'); showToast('🚪','Visitor at gate','Guest for A-201 (Sharma Family)'); render();},
  ()=>{const d=state.deliveries.find(x=>x.id===7); if(d)d.status='arrived'; notify('📦','Amazon delivered to A-302');
       showToast('📦','Amazon delivered','A-302'); render();},
  ()=>{const c=state.complaints.find(x=>x.id===25); if(c)c.status='resolved'; notify('✅','Resolved: streetlight near B-block');
       showToast('✅','Complaint resolved','Streetlight near B-block'); render();},
  ()=>{const d=state.deliveries.find(x=>x.id===10); if(d)d.status='arrived'; notify('🚕','Uber arrived for B-301');
       showToast('🚕','Cab arrived','Uber → B-301'); render();},
  ()=>{state.notices.unshift({id:nextId(),title:'Summer evening get-together',body:'Lawn, Sat 6 PM. Snacks by the committee.',date:'26 May'});
       notify('📢','New notice: Summer get-together'); showToast('📢','New notice posted','Summer get-together • Sat 6 PM'); render();},
];
let evIdx=0, evTimer=null, mode='running';
function engineTick(){
  simMin+=2; renderClock();
  if(evIdx<DAY.length){ DAY[evIdx++](); }
  else { stopEngine('done'); }
}
function startEngine(){ if(evTimer)return; mode='running'; setEngineBtn();
  clockTimer=setInterval(()=>{simMin+=1;renderClock();},2500);
  evTimer=setInterval(engineTick,6000); }
function pauseTimers(){ clearInterval(evTimer);clearInterval(clockTimer); evTimer=null;clockTimer=null; }
function pauseEngine(){ pauseTimers(); mode='paused'; setEngineBtn(); }
function stopEngine(){ pauseTimers(); mode='done'; setEngineBtn(); }
function toggleEngine(){ if(mode==='running')pauseEngine(); else if(mode==='paused')startEngine(); else replayDay(); }
function replayDay(){ pauseTimers(); state=freshState(); simMin=9*60+14; evIdx=0; renderClock(); updateBadge(); render(); startEngine(); showToast('↻','Replaying the day','Live feed restarted'); }
function setEngineBtn(){ const b=document.getElementById('engineBtn'), tag=document.getElementById('liveTag');
  if(mode==='running'){b.textContent='⏸';b.title='Pause live events';tag.classList.remove('off');}
  else if(mode==='paused'){b.textContent='▶';b.title='Resume live events';tag.classList.add('off');}
  else {b.textContent='↻';b.title='Replay the day';tag.classList.add('off');} }

/* ====================== init ====================== */
renderClock(); updateBadge(); render(); startEngine();
</script>
